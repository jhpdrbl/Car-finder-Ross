# Approximate ground clearance (inches) by model; used for scoring only.
# Glass roofs that DON'T OPEN (user, Oct 24 2026: "If the sunroofs don't open then don't include them"; before that a fixed
# glass roof counted). opening: never = the car fails even when the dealer's page says "sunroof" (dealers call fixed glass
# roofs that too); opening: optional = fixed roof standard, an opening one only as an option, so it passes only when the
# listing says the roof tilts / slides (or you confirm it), else it's a call. Matching works like sunroof_standard.
