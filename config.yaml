# Search criteria for the CPO SUV finder (spec Sections 3-5, 7, 11).

home:
  zip: "90039"
  lat: 34.1105   # 90039 (Atwater Village / Silver Lake) centroid
  lon: -118.2600
  radius_miles: 50          # dealers 50-60 mi still count, flagged "edge"
  edge_radius_miles: 60      # farthest dealer included

scrape:
  user_agent: "CarFinderRoss/0.1 (personal CPO SUV search; contact jhpd.rbl@gmail.com)"
  min_delay_seconds: 2.0
  max_delay_seconds: 3.0
  cache_hours: 6
  timeout_seconds: 30
  max_vdps_per_dealer: 400

filters:
  min_year: 2023
  max_mileage: 39999          # "under 40,000"
  drivetrains: [AWD, 4WD]
  max_rows: 2
  price_caps:                 # total incl. dealer fees, before tax
    gas: 35000
    hybrid: 40000
    phev: 40000
    ev: null                  # EV only if exceptional_ev_deal
  price_tolerance: 500        # cushion over every cap (gas $35,500, hybrid/PHEV $40,500)
  exceptional_ev_discount: 0.15
  ev_min_comparables: 3
  estimated_fees:             # used when the page shows no fee breakdown
    doc_fee: 85               # California dealer doc-fee cap
    other_fees: 100           # electronic filing etc.
  sunroof_required: true
  exterior_colors:
    include: [black, gray, grey, graphite, charcoal, gunmetal, thunder, makalu,
              mythos, vik, onyx, daytona, carbon, obsidian, magnetic, crystal black,
              "dark green", "autumn green", "british racing", "racing green",
              "cypress green", "eruption green", "area 51", "shadow", "slate",
              "manhattan", "ebony", "jet", "nebula", "smoke", "tungsten", "anthracite",
              "storm", "asphalt", "steel", "cement", "lunar", "magnetite", "iridium",
              "selenite", "titanium", "ash"]   # list reviewed per-run in fail_reasons
    exclude: [silver, white, pearl white, beige, blue, red, matte, frozen, glacier, ivory,
              cream, champagne, bronze, orange, yellow, brown, copper, gold, tan]
    green_must_be_dark: true  # light greens (e.g. "Sage", "Lime") excluded
  interior_colors:
    include: [black, obsidian, charcoal, "slate black", ebony, jet, onyx, "black/black"]
    exclude: [beige, brown, white, red, tan, cognac, saddle, ivory, cream, caramel,
              chestnut, macchiato, sand, "palomino", "rioja", "glazed caramel", blond, blonde,
              oyster, parchment, linen, "light gray", amber, cognac, mocha, espresso, sienna, "flaxen"]
  carfax_exclude_accident: true

scoring:            # higher = better; weights sum is arbitrary, score scaled 0-100
  price_target: 30000
  weights:
    price: 30       # high
    phev: 25        # high
    mpg: 12         # medium
    audio: 12       # medium
    leather: 5      # low
    ventilated_seats: 5
    ground_clearance: 5
    spare_tire: 6
  premium_audio: ["bang & olufsen", "b&o", "lexicon", "harman/kardon", "harman kardon",
                  "burmester", "bowers & wilkins", "bowers and wilkins", "mark levinson"]
  fake_leather: [leatherette, "mb-tex", "mb tex", sensatec, startex, softex, "synthetic leather",
                 "vegan leather", "nuluxe", "leather-trimmed seats with synthetic"]

finance:
  down_payment: 8000
  term_months: 60
  apr: 0.0534
  sales_tax: 0.0975
  gov_fees: 400

# Warranty end dates on the dashboard assume this much driving per year after you buy.
warranty:
  miles_per_year: 12000

buying_context:
  - "$8,000 down; Bank of America pre-approval at 5.34% APR (30-day validity)"
  - "Earliest pickup: November 14"
  - "Insurance: AAA (bundled with renters)"
  - "Gas-only cars capped at $35,000"

# Which models count, per dealer brand. Each brand has:
#   allow: regex that the model name must match
#   rules: checked against "model + trim + title + listing URL" (lower case);
#          when `if` matches (and `unless` doesn't), the car is excluded (fail),
#          sent to Needs a call (call), or just flagged (note). `min_year` adds a year rule.
# CPO program names are in verify/certification.py.
models:
  Audi:
    allow: '\bq[35]\b'
    list: Q3, Q5
    rules:
      - {if: '\bsq[35]\b|\brs ?q', then: fail, why: 'SQ3/SQ5/RS model (performance versions not on the list)'}
      - {if: 'sportback', then: note, why: 'Sportback'}
  Genesis:
    allow: 'gv70|gv80'
    list: GV70, GV80
    rules:
      - {if: 'gv80.*coupe', then: note, why: 'GV80 Coupe'}
  Subaru:
    allow: 'forester|outback'
    list: Forester, Outback
    rules:
      - {if: 'forester', unless: 'limited|touring|wilderness|hybrid|strong hev', then: fail,
         why: 'Forester trim (Limited/Touring/Wilderness or Hybrid only)'}
      - {if: 'outback', unless: 'limited|touring|wilderness', then: fail, why: 'Outback trim (Limited/Touring/Wilderness only)'}
  BMW:
    allow: '\bx[35]\b'
    list: X3, X5
    rules:
      - {if: 'sdrive', then: fail, why: 'sDrive (rear-wheel drive)'}
      - {if: '\bm40|\bm50|\bm60|x[35] m\b|competition', then: fail, why: 'M version (only X3 xDrive30i, X5 xDrive40i/50e)'}
  Mercedes-Benz:
    allow: 'glc|gle'
    list: GLC 300/350e, GLE 350/450/450e
    rules:
      - {if: 'amg|gl[ce] ?43|gl[ce] ?53|gl[ce] ?63|coupe|gle ?580', then: fail, why: 'AMG / Coupe / GLE 580 (not on the list)'}
  Volkswagen:
    allow: 'tiguan'
    list: Tiguan 2025+
    rules:
      - {min_year: 2025, why: 'Tiguan before 2025 (AWD versions have a third row)'}
  Lexus:
    allow: '\b(nx|rx)\b'
    list: NX, RX
    rules:
      - {if: 'rx ?\d{3}h?\+? ?l\b|\brx ?l\b', then: fail, why: 'RX L (3-row)'}
      - {if: 'nx ?250|\b250\b', unless: '350|450', then: fail, why: 'NX 250 (only NX 350 / 350h / 450h+)'}
  Volvo:
    allow: 'xc60|xc40|ex40'
    list: XC60, XC40
  Toyota:
    allow: '4runner|land cruiser'
    list: 4Runner, Land Cruiser 2024+
    rules:
      - {if: 'land cruiser', min_year: 2024, why: 'Land Cruiser before 2024'}
  Ford:
    allow: 'bronco'
    list: Bronco 4-door
    rules:
      - {if: 'bronco sport|bronco-sport', then: fail, why: 'Bronco Sport (not on the list)'}
      - {if: '2[- ]?door|2dr', then: fail, why: '2-door Bronco'}
      - {if: 'bronco', unless: '4[- ]?door|4dr', then: call, why: "confirm it's a 4-door Bronco"}

# Trims where a sunroof is always standard, used only when the listing doesn't say
# (shown as "sunroof (standard on this trim)"). Edit if you know better.
sunroof_standard:
  # Q5: optional on the 2023-2025 Premium (old generation and first new-generation SUVs); standard from 2026
  - {make: Audi, model: Q5, trim_regex: "premium plus|prestige", note: "panoramic sunroof is standard on Q5 Premium Plus / Prestige"}
  - {make: Audi, model: Q5, trim_regex: "sportback", min_year: 2025, note: "panoramic sunroof is standard on the 2025+ Q5 Sportback"}
  - {make: Audi, model: Q5, trim_regex: ".*", min_year: 2026, note: "panoramic sunroof is standard on the 2026+ Q5"}
  - {make: Audi, model: Q3, trim_regex: ".*", note: "panoramic sunroof is standard on every Q3"}
  - {make: BMW, model: X5, trim_regex: ".*", note: "panoramic moonroof is standard on the X5"}
  - {make: Genesis, model: GV70, trim_regex: "select|advanced|prestige", note: "panoramic roof standard from Select up"}
  - {make: Volvo, model: XC60, trim_regex: "plus|ultimate|inscription|r-design", note: "panoramic roof standard on Plus/Ultimate"}
  - {make: Ford, model: Bronco, trim_regex: ".*", note: "removable roof panels"}
  # Subaru (media.subaru.com spec sheets, Oct 2026): Forester = every trim but Base; Outback = Touring and XT
  # every year, Limited from 2025; Outback Wilderness and the 2023-24 Outback Limited have it only as an option
  - {make: Subaru, model: Forester, trim_regex: "premium|sport|limited|touring|wilderness|hybrid", note: "panoramic moonroof is standard on every Forester but the Base"}
  - {make: Subaru, model: Outback, trim_regex: "touring|\\bxt\\b", note: "moonroof is standard on Outback Touring / XT"}
  - {make: Subaru, model: Outback, trim_regex: "limited", min_year: 2025, note: "moonroof is standard on the 2025+ Outback Limited"}

# Approximate ground clearance (inches) by model; used for scoring only.
ground_clearance_in:
  Q5: 8.2
  Q3: 6.9
  GV80: 7.9
  RX: 8.1
  X5: 8.2
  GLE: 7.3
  XC40: 8.3
  GV70: 7.1
  Forester: 8.7
  Forester Wilderness: 9.2
  Outback: 8.7
  Outback Wilderness: 9.5
  X3: 8.0
  GLC: 7.4
  Tiguan: 7.9
  NX: 8.1
  XC60: 8.5
  4Runner: 9.0
  Land Cruiser: 8.7
  Bronco: 8.4

# Typical spare-tire situation by model when the listing doesn't say (scoring only).
spare_tire_typical:
  Q5: true
  Q3: true
  X5: false
  GLE: false
  GV70: false
  Forester: true
  Outback: true
  X3: false
  GLC: false
  Tiguan: true
  NX: true
  XC60: false
  4Runner: true
  Land Cruiser: true
  Bronco: true

# "Check yourself" tab: these brands are listed first (Ross's top brands)
top_brands: [Audi, Subaru, Genesis]

# ---------------------------------------------------------------------------------------------
# Buyers. The search runs once; every car is checked against each buyer's rules separately.
# Ross uses the settings above (results in data/ and output/). Each other buyer's settings are
# merged over the ones above (`models` and `buying_context` are replaced, not merged); their
# results go to data/<id>/ and output/<id>/, and their page is cpo-suv-finder.pages.dev/<id>/.
# ---------------------------------------------------------------------------------------------
profiles:
  ross:
    label: Ross
    theme: {name: British Racing Green, light: "#004225", dark: "#5fae84"}
  jenna:
    label: Jenna
    theme: {name: Cobalt Blue, light: "#0047ab", dark: "#7aa5ff"}
    buying_context: []
    top_brands: [Toyota, Lexus, Subaru, Kia]
    trim_guide: data/jenna/trim_guide.json
    filters:
      min_year: 2023              # "2023 or newer"
      max_mileage: 39999          # "under 40,000"
      max_rows: 2                 # no third row
      fuels: [hybrid]             # regular hybrids only: no plug-ins, no mild hybrids (those count as gas)
      price_caps: {gas: 40000, hybrid: 40000, phev: 40000, ev: null}   # "under $40,000", incl. dealer fees, before tax
      price_tolerance: 0
      sunroof_required: false     # nice to have: shown and scored, never excludes
      no_cloth_seats: true        # leather or synthetic leather only
      also_suv: '\bux\b'          # the VIN record calls the Lexus UX a "wagon"; Lexus sells it as an SUV
      exterior_colors:            # any color except red / orange
        include: null
        describe: red/orange
        exclude: [red, orange, ruby, crimson, cardinal, burgundy, maroon, garnet, scarlet, cherry, merlot, "wine",
                  lava, inferno, barcelona, matador, tangerine, "sunset", mango, flame, "hot pepper", "redline",
                  "rapid red", "rally red", "runway red", "supersonic", "venetian", "rosso", "rojo"]
      interior_colors:            # any interior except white (Oct 16 2026)
        include: null
        exclude: [white, ivory, cream, "off-white", snow, bianco, alabaster]
    scoring:                      # Jenna's nice-to-haves, in her order (Oct 16 2026): exterior color, mileage, sunroof, real leather
      weights:
        exterior_color: 40        # by her color order below
        mileage: 30               # fewer miles = more points (0 mi = all, 40,000 = none)
        sunroof: 20
        real_leather: 10          # real leather full points, synthetic leather 40%
      color_rank: [black, gray, dark blue, brown, silver, gold, white]   # anything else after these
    # Trim facts for Jenna's models (researched Oct 2026 from Toyota/Lexus/Subaru press sites, fueleconomy.gov,
    # Car and Driver where makers refused). seat_material is used when a listing doesn't say: cloth / synthetic /
    # leather, or cloth_std = cloth standard, better seats optional (asks instead of excluding).
    # sunroof_standard here = Ross's list plus her models (only for her page; a sunroof is just nice-to-have for her).
    seat_material:
      - {make: Toyota, model: RAV4, trim_regex: xle premium, min_year: 2023, max_year: 2026, material: synthetic, note: 'SofTex standard on XLE Premium (2026: AWD only qualifies)'}
      - {make: Toyota, model: RAV4, trim_regex: limited, min_year: 2023, max_year: 2026, material: synthetic, note: SofTex standard on Limited}
      - {make: Toyota, model: RAV4, trim_regex: woodland, min_year: 2026, max_year: 2026, material: synthetic, note: 2026 Woodland has SofTex standard}
      - {make: Toyota, model: RAV4, trim_regex: woodland, min_year: 2023, max_year: 2025, material: cloth, note: 2023-25 Woodland Edition has fabric seats}
      - {make: Toyota, model: RAV4, trim_regex: \bxse\b, min_year: 2023, max_year: 2025, material: cloth, note: 'mixed: SofTex bolsters with fabric seat inserts (judgment call)'}
      - {make: Toyota, model: RAV4, trim_regex: \bxse\b, min_year: 2026, max_year: 2026, material: cloth, note: 'mixed: SofTex with synthetic-suede inserts (judgment call)'}
      - {make: Toyota, model: RAV4, trim_regex: \bse\b, min_year: 2023, max_year: 2026, material: cloth, note: fabric with blue stitching}
      - {make: Toyota, model: RAV4, trim_regex: \bxle\b, min_year: 2023, max_year: 2025, material: cloth, note: 'plain XLE: fabric (XLE Premium matched above)'}
      - {make: Toyota, model: RAV4, trim_regex: \ble\b, min_year: 2023, max_year: 2026, material: cloth, note: 'LE: fabric'}
      - {make: Toyota, model: Venza, trim_regex: limited|nightshade|\bxle\b, min_year: 2023, max_year: 2024, material: synthetic, note: SofTex standard on XLE / Nightshade / Limited}
      - {make: Toyota, model: Venza, trim_regex: \ble\b, min_year: 2023, max_year: 2024, material: cloth, note: 'LE: fabric'}
      - {make: Toyota, model: Corolla Cross, trim_regex: \bxse\b, min_year: 2023, max_year: 2027, material: cloth, note: 'mixed: SofTex with mixed-media (fabric) inserts (judgment call)'}
      - {make: Toyota, model: Corolla Cross, trim_regex: nightshade|\bse\b|\bs\b, min_year: 2023, max_year: 2027, material: cloth, note: 'S / SE / Nightshade: fabric'}
      - {make: Toyota, model: Crown Signia, trim_regex: .*, min_year: 2025, max_year: 2026, material: leather, note: leather-trimmed on XLE and Limited}
      - {make: Lexus, model: UX, trim_regex: .*, min_year: 2023, material: synthetic, note: NuLuxe synthetic standard on every UX hybrid grade}
      - {make: Lexus, model: NX, trim_regex: luxury, min_year: 2022, material: leather, note: genuine leather on NX Luxury}
      - {make: Lexus, model: NX, trim_regex: .*, min_year: 2022, material: synthetic, note: NuLuxe synthetic standard on NX 350h base/Premium/F SPORT}
      - {make: Lexus, model: RX, trim_regex: '500h|premium ?(\+|plus)|luxury', min_year: 2023, material: leather, note: 'leather on RX Premium+, Luxury and 500h F SPORT Performance (500h: confirm on sticker)'}
      - {make: Lexus, model: RX, trim_regex: .*, min_year: 2023, material: synthetic, note: NuLuxe synthetic standard on RX 350h base/Premium/F SPORT Design}
      - {make: Kia, model: Sportage, trim_regex: 'sx ?prestige|x ?line', min_year: 2023, material: synthetic, note: premium SynTex standard on Sportage Hybrid X-Line / SX-Prestige}
      - {make: Kia, model: Sportage, trim_regex: \bex\b, min_year: 2023, material: synthetic, note: SynTex standard on Sportage Hybrid EX}
      - {make: Kia, model: Sportage, trim_regex: \blx\b, min_year: 2023, material: cloth, note: cloth on Sportage LX}
      - {make: Kia, model: Sportage, trim_regex: \bhybrid s\b|\bsportage s\b|\bs (awd|fwd)\b, min_year: 2026, material: cloth, note: cloth on Sportage Hybrid S}
      - {make: Ford, model: Escape, trim_regex: platinum, min_year: 2023, material: synthetic, note: ActiveX synthetic standard on Escape Platinum}
      - {make: Ford, model: Escape, trim_regex: st line elite, min_year: 2023, material: cloth_std, note: partial vinyl/cloth standard on ST-Line Elite; ActiveX (2025+) or leather (2023-24) only with the Premium Technology Package}
      - {make: Ford, model: Escape, trim_regex: st line, min_year: 2023, material: cloth, note: cloth on Escape ST-Line / ST-Line Select}
      - {make: Subaru, model: Crosstrek, trim_regex: limited.*hybrid|hybrid.*limited, min_year: 2026, material: synthetic, note: gray StarTex on Crosstrek Limited Hybrid}
      - {make: Subaru, model: Crosstrek, trim_regex: sport.*hybrid|hybrid.*sport, min_year: 2026, material: cloth, note: Sport cloth on Crosstrek Sport Hybrid}
      - {make: Subaru, model: Forester, trim_regex: touring.*hybrid|hybrid.*touring, min_year: 2025, material: leather, note: leather on Forester Touring Hybrid}
      - {make: Subaru, model: Forester, trim_regex: (limited|sport|wilderness).*hybrid|hybrid.*(limited|sport|wilderness), min_year: 2025, material: synthetic, note: StarTex on Forester Sport / Limited / Wilderness Hybrid}
      - {make: Subaru, model: Forester, trim_regex: premium.*hybrid|hybrid.*premium, min_year: 2025, material: cloth, note: cloth on Forester Premium Hybrid}
      - {make: Mazda, model: CX-50, trim_regex: 'premium ?(plus|\+)', min_year: 2025, max_year: 2026, material: leather, note: 'CX-50 Hybrid Premium Plus: leather-trimmed (black or red). Gas 2.5 S/Turbo Premium Plus are also leather but are dropped by the VIN fuel check'}
      - {make: Mazda, model: CX-50, trim_regex: premium, min_year: 2025, max_year: 2026, material: leather, note: 'CX-50 Hybrid Premium: leather-trimmed (black or hybrid-only red). (2025 gas 2.5 S Premium was half-leatherette, but gas CX-50s are dropped by VIN)'}
      - {make: Mazda, model: CX-50, trim_regex: preferred, min_year: 2025, max_year: 2026, material: cloth, note: 'CX-50 Hybrid Preferred: half leatherette = leatherette with cloth (mixed, counts as cloth)'}
      - {make: Lincoln, model: Nautilus, trim_regex: black label, min_year: 2024, max_year: 2027, material: leather, note: 'Black Label: Venetian leather'}
      - {make: Lincoln, model: Nautilus, trim_regex: reserve, min_year: 2024, max_year: 2027, material: leather, note: 'Reserve: leather-trimmed seats'}
      - {make: Lincoln, model: Nautilus, trim_regex: .*, min_year: 2024, max_year: 2027, material: synthetic, note: 'Premiere: Luxury Soft Touch leatherette (synthetic, no cloth)'}
    sunroof_standard:
      - {make: Audi, model: Q5, trim_regex: premium plus|prestige, note: panoramic sunroof is standard on Q5 Premium Plus / Prestige}
      - {make: Audi, model: Q5, trim_regex: sportback, min_year: 2025, note: panoramic sunroof is standard on the 2025+ Q5 Sportback}
      - {make: Audi, model: Q5, trim_regex: .*, min_year: 2026, note: panoramic sunroof is standard on the 2026+ Q5}
      - {make: Audi, model: Q3, trim_regex: .*, note: panoramic sunroof is standard on every Q3}
      - {make: BMW, model: X5, trim_regex: .*, note: panoramic moonroof is standard on the X5}
      - {make: Genesis, model: GV70, trim_regex: select|advanced|prestige, note: panoramic roof standard from Select up}
      - {make: Volvo, model: XC60, trim_regex: plus|ultimate|inscription|r-design, note: panoramic roof standard on Plus/Ultimate}
      - {make: Ford, model: Bronco, trim_regex: .*, note: removable roof panels}
      - {make: Subaru, model: Forester, trim_regex: premium|sport|limited|touring|wilderness|hybrid, note: panoramic moonroof is standard on every Forester but the Base}
      - {make: Subaru, model: Outback, trim_regex: touring|\bxt\b, note: moonroof is standard on Outback Touring / XT}
      - {make: Subaru, model: Outback, trim_regex: limited, min_year: 2025, note: moonroof is standard on the 2025+ Outback Limited}
      - {make: Toyota, model: RAV4, trim_regex: xle premium|limited|\bxse\b, min_year: 2023, max_year: 2025, note: power tilt/slide moonroof standard on XLE Premium / XSE / Limited}
      - {make: Toyota, model: RAV4, trim_regex: limited, min_year: 2026, max_year: 2026, note: panoramic glass roof standard on 2026 Limited}
      - {make: Toyota, model: RAV4, trim_regex: \bxse\b, min_year: 2026, max_year: 2026, note: power moonroof standard on 2026 XSE}
      - {make: Toyota, model: Crown Signia, trim_regex: limited, min_year: 2025, max_year: 2026, note: panoramic fixed-glass roof standard on Limited}
      - {make: Lexus, model: UX, trim_regex: 'premium|f ?sport', min_year: 2023, max_year: 2026, note: 'power moonroof standard on UX Premium, F SPORT Design and F SPORT Handling'}
      - {make: Lexus, model: NX, trim_regex: 'premium|luxury|f ?sport', min_year: 2022, max_year: 2026, note: moonroof standard on NX 350h Premium / Luxury / F SPORT Handling}
      - {make: Lexus, model: RX, trim_regex: '500h|premium|luxury|f ?sport', min_year: 2023, max_year: 2026, note: moonroof standard on RX Premium and up; panoramic on Luxury and 500h}
      - {make: Kia, model: Sportage, trim_regex: 'sx ?prestige|x ?line', min_year: 2023, note: panoramic sunroof standard on Sportage Hybrid SX-Prestige and X-Line}
      - {make: Subaru, model: Crosstrek, trim_regex: sport.*hybrid|hybrid.*sport, min_year: 2026, note: power moonroof standard on Crosstrek Sport Hybrid}
      - {make: Subaru, model: Crosstrek, trim_regex: limited.*hybrid|hybrid.*limited, min_year: 2027, note: power moonroof standard on the 2027+ Crosstrek Limited Hybrid (optional on 2026)}
      - {make: Subaru, model: Forester, trim_regex: (premium|sport|limited|touring).*hybrid|hybrid.*(premium|sport|limited|touring), min_year: 2025, note: panoramic moonroof standard on every Forester Hybrid except possibly the 2027 Wilderness Hybrid (unconfirmed)}
      - {make: Mazda, model: CX-50, trim_regex: premium, min_year: 2025, max_year: 2026, note: power sliding panoramic moonroof standard on CX-50 Hybrid Premium / Premium Plus}
      - {make: Mazda, model: CX-50, trim_regex: preferred, min_year: 2026, max_year: 2026, note: panoramic moonroof standard on 2026 Hybrid Preferred (not on 2025 Preferred)}
      - {make: Lincoln, model: Nautilus, trim_regex: black label, min_year: 2024, max_year: 2027, note: Panoramic Vista Roof standard on Black Label}
      - {make: Lincoln, model: Nautilus, trim_regex: reserve, min_year: 2025, max_year: 2026, note: 'Panoramic Vista Roof in Reserve II, standard on 2025+ Reserve per Lincoln dealer trim pages (2024 Reserve: optional package; confirm on sticker)'}
    ground_clearance_in: {'CX-50': 7.8, Nautilus: 7.9, Corolla Cross: 8.0, Crosstrek: 8.7, Crown Signia: 6.7, RAV4: 8.1, Sportage: 8.3, UX: 6.3, Venza: 7.8}
    spare_tire_typical: {'CX-50': true, Nautilus: false, Corolla Cross: false, Crown Signia: false, Escape: true, RAV4: true, Sportage: true, UX: false, Venza: true}
    # Models: 2-row regular-hybrid SUVs with AWD/4WD, 2023+, from Ross's brands plus Kia and Acura. `tokens` are
    # the words looked for in dealer URLs. Gas, plug-in and mild-hybrid versions are dropped by the
    # VIN's fuel type, so rules only need to catch names.
    models:
      Toyota:
        allow: 'rav ?-?4|venza|corolla ?-?cross|crown ?-?signia'
        list: RAV4 Hybrid, Venza, Corolla Cross Hybrid, Crown Signia
        tokens: [rav4, rav-4, venza, corolla-cross, corollacross, crown-signia, crownsignia]
        rules:
          - {if: 'prime|plug-?in|\bphev\b', then: fail, why: 'plug-in hybrid (RAV4 Prime / Plug-in Hybrid)'}
      Lexus:
        allow: '\b(ux|nx|rx)\b'
        list: UX 250h/300h, NX 350h, RX 350h/500h
        tokens: [ux, nx, rx]
        rules:
          - {if: '450h\+|plug-?in', then: fail, why: 'plug-in hybrid (450h+)'}
          - {if: 'rx ?\d{3}h?\+? ?l\b|\brx ?l\b', then: fail, why: 'RX L (3-row)'}
      Subaru:
        allow: 'forester|crosstrek'
        list: Forester Hybrid 2025+, Crosstrek Hybrid 2026+
        tokens: [forester, crosstrek]
        rules:
          - {if: 'plug.?in|phev', then: fail, why: 'plug-in hybrid (the 2019-2023 Crosstrek Hybrid)'}
          - {if: 'crosstrek', min_year: 2026, why: 'Crosstrek before 2026 (the older Crosstrek Hybrid was a plug-in)'}
          - {if: 'forester', min_year: 2025, why: 'Forester before 2025 (no regular hybrid)'}
      Kia:
        allow: 'sportage'
        list: Sportage Hybrid
        tokens: [sportage]
        feed_models: [Sportage Hybrid]      # model names in kia.com's certified search
        rules:
          - {if: 'plug-?in|phev', then: fail, why: 'plug-in hybrid'}
      Ford:
        allow: 'escape'
        list: Escape Hybrid
        tokens: [escape]
        rules:
          - {if: 'plug-?in|phev', then: fail, why: 'plug-in hybrid (Escape PHEV)'}
      Mazda:
        allow: '\bcx ?-?50\b'
        list: CX-50 Hybrid 2025+
        tokens: [cx-50, cx50]
        rules:
          - {if: 'cx ?-?50', min_year: 2025, why: 'CX-50 before 2025 (no hybrid)'}
      Lincoln:
        allow: 'nautilus|corsair'
        list: Nautilus Hybrid 2024+, Corsair Hybrid 2027+
        tokens: [nautilus, corsair]
        rules:
          - {if: 'nautilus', min_year: 2024, why: 'Nautilus before 2024 (no hybrid)'}
          - {if: 'corsair', min_year: 2027, why: 'Corsair before 2027 (its hybrid was the Grand Touring plug-in)'}
          - {if: 'grand touring|plug.?in|phev', then: fail, why: 'plug-in hybrid (Corsair / Aviator Grand Touring)'}
      # Acura: no 2-row regular-hybrid SUV for 2023+ (EPA data, Oct 2026: RDX/MDX/ADX gas, ZDX electric), so no
      # Acura models yet and Acura dealers aren't searched; add a model here if Acura sells one.

# Phone website (Cloudflare Pages). The digest's buying-context lines (down payment,
