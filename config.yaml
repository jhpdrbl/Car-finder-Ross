# Search criteria for the CPO SUV finder (spec Sections 3-5, 7, 11).

home:
  zip: "90039"
  lat: 34.1105   # 90039 (Atwater Village / Silver Lake) centroid
  lon: -118.2600
  radius_miles: 50          # dealers 50-60 mi still count, flagged "edge"
  edge_radius_miles: 60      # farthest dealer included

scrape:
  user_agent: "CarFinderRoss/0.1 (personal CPO SUV search; contact jhpd.rbl@gmail.com)"
  min_delay_seconds: 2.0
  max_delay_seconds: 3.0
  cache_hours: 6
  timeout_seconds: 30
  max_vdps_per_dealer: 400

filters:
  min_year: 2023
  max_mileage: 39999          # "under 40,000"
  drivetrains: [AWD, 4WD]
  max_rows: 2
  price_caps:                 # total incl. dealer fees, before tax
    gas: 35000
    hybrid: 40000
    phev: 40000
    ev: 40000                 # electric added Oct 18 2026 (user: "Add electric"); same cap as hybrid/plug-in. null = only exceptional EV deals
  price_tolerance: 500        # cushion over every cap (gas $35,500, hybrid/PHEV $40,500)
  exceptional_ev_discount: 0.15
  ev_min_comparables: 3
  estimated_fees:             # used when the page shows no fee breakdown
    doc_fee: 85               # California dealer doc-fee cap
    other_fees: 100           # electronic filing etc.
  sunroof_required: true
  sedans:                     # plug-in hybrid / electric sedans (and hybrids with 40+ mpg), AWD (user, Oct 19 2026); full-size too since Oct 21 2026
    fuels: [phev, ev, hybrid]
    hybrid_min_mpg: 40        # regular hybrid sedans only if they average 40+ mpg (EPA combined; user, Oct 19 2026)
    exclude_makes: [Toyota, Kia, Mazda]   # user, Oct 19 2026: "No Toyota kia or Mazda sedans"
    # sedan model names, for cars whose VIN record has no body type (gas sedans are excluded)
    models: '\b[357] series\b|\b[35][35]0e\b|\b750e\b|\bi[457]\b|\beq[es]\b(?!.*suv)|\bs[- ]?class\b|\bs ?580e\b|\b[ce][ -]?class\b|(?<![a-z])[ce] ?(53|63)\b|e-?tron gt|\b[as]6\b.*e-?tron|\bes ?\d{3}|\bs[69]0\b'
  exterior_colors:
    include: [black, gray, grey, graphite, charcoal, gunmetal, thunder, makalu,
              mythos, vik, onyx, daytona, carbon, obsidian, magnetic, crystal black,
              "dark green", "autumn green", "british racing", "racing green",
              "cypress green", "eruption green", "area 51", "shadow", "slate",
              "manhattan", "ebony", "jet", "nebula", "smoke", "tungsten", "anthracite",
              "storm", "asphalt", "steel", "cement", "lunar", "magnetite", "iridium",
              "selenite", "titanium", "ash", grigio, nero, "verde fangio", "verde montreal"]   # Alfa: grigio = gray, nero = black, Verde Fangio/Montreal = dark greens   # list reviewed per-run in fail_reasons
    exclude: [silver, white, pearl white, wind chill, beige, blue, red, matte, frozen, glacier, ivory,
              cream, champagne, bronze, orange, yellow, brown, copper, gold, tan,
              sage, mint, lime, seafoam, pistachio, snowfall, rosso, giallo, bianco, "tiger eye"]   # light greens (user, Oct 19 2026: "Sage green is not dark green")
    green_must_be_dark: true  # light greens (e.g. "Sage", "Lime") excluded
  interior_colors:
    include: [black, obsidian, charcoal, "slate black", ebony, jet, onyx, "black/black"]   # two-tones with one of these pass too
    exclude: [beige, brown, white, red, tan, cognac, saddle, ivory, cream, caramel,
              chestnut, macchiato, sand, "palomino", "rioja", "glazed caramel", blond, blonde,
              oyster, parchment, linen, "light gray", amber, cognac, mocha, espresso, sienna, "flaxen",
              greige, griege, terracotta, caturra, roast, "navy pier", norias, truffle, "bronze fire", hazel, "misty gray",
              castanea, amido, stonegray, "stone gray", "stone grey", "rose gold", "space gray", "space grey", "performance gray",
              "blue leather", "gray startex", "gray and blue", dapple, grayscale, macadamia, "torrent navy", "aqua green",
              "sky blue", "glacier white", cinnamon, fjord, boulder, graystone, orchid, chocolate, crema]
  carfax_exclude_accident: true

scoring:            # higher = better; weights sum is arbitrary, score scaled 0-100
  price_target: 30000
  weights:
    price: 30       # high
    phev: 25        # high (electric cars get it too: they plug in)
    mpg: 12         # medium
    audio: 12       # medium
    leather: 5      # low
    ventilated_seats: 5
    ground_clearance: 5
    spare_tire: 6
  premium_audio: ["bang & olufsen", "b&o", "lexicon", "harman/kardon", "harman kardon",
                  "burmester", "bowers & wilkins", "bowers and wilkins", "mark levinson"]
  fake_leather: [leatherette, "mb-tex", "mb tex", sensatec, startex, softex, "synthetic leather",
                 "vegan leather", "nuluxe", "leather-trimmed seats with synthetic"]

finance:
  down_payment: 8000
  term_months: 60
  apr: 0.0534
  sales_tax: 0.0975
  gov_fees: 400

# Warranty end dates on the dashboard assume this much driving per year after you buy.
warranty:
  miles_per_year: 12000

buying_context:
  - "$8,000 down; Bank of America pre-approval at 5.34% APR (30-day validity)"
  - "Earliest pickup: November 14"
  - "Insurance: AAA (bundled with renters)"
  - "Gas-only cars capped at $35,000"

# Which models count, per dealer brand. Each brand has:
#   allow: regex that the model name must match
#   rules: checked against "model + trim + title + listing URL" (lower case);
#          when `if` matches (and `unless` doesn't), the car is excluded (fail),
#          sent to Needs a call (call), or just flagged (note). `min_year` adds a year rule.
# CPO program names are in verify/certification.py.
models:
  Audi:
    allow: '\bs?q[35]\b|\bs?q[468] ?(sportback )?e-?tron|\be-?tron\b|\brs ?q[38]\b|\b[as]6\b'
    list: Q3, Q5, electric Q4 / Q6 / Q8 e-tron; electric sedans e-tron GT, A6 / S6 Sportback e-tron
    tokens: [q4, q6, q8, e-tron]
    rules:
      # performance versions (SQ5, SQ6/SQ8 e-tron, e-tron S, RS Q8) are fine (user, Oct 19 2026) if they meet the other rules
      - {if: 'q4 (sportback )?(40|45) e-?tron', then: fail, why: 'Q4 40 / 45 e-tron (rear-wheel drive; only the quattro qualifies)'}
      - {if: '(?=.*e-?tron)(?=.*\b(rwd|rear.wheel)\b)', then: fail, why: 'A6 e-tron without quattro (rear-wheel drive)'}
      - {if: 'sportback', then: note, why: 'Sportback'}
  Genesis:
    allow: 'gv60|gv70|gv80'
    list: GV60 (electric), GV70 (incl. Electrified), GV80
    tokens: [gv60]
    rules:
      - {if: 'gv80.*coupe', then: note, why: 'GV80 Coupe'}
  Subaru:
    allow: 'forester|outback|solterra'
    list: Forester, Outback, Solterra (electric)
    tokens: [solterra]
    rules:
      - {if: 'forester', unless: 'limited|touring|wilderness|hybrid|strong hev', then: fail,
         why: 'Forester trim (Limited/Touring/Wilderness or Hybrid only)'}
      - {if: 'outback', unless: 'limited|touring|wilderness', then: fail, why: 'Outback trim (Limited/Touring/Wilderness only)'}
      - {if: 'solterra', unless: 'touring', then: fail, why: 'Solterra Premium / Limited: no sunroof offered (Touring only)'}
  BMW:
    allow: '\bx[35]\b|\bix\b|\b[357] series\b|\b[35][35]0e\b|\b750e\b|\bi[457]\b'
    list: X3, X5, iX (electric); plug-in / electric sedans 330e xDrive, 530e / 550e xDrive, 750e xDrive, i4, i5, i7
    tokens: [ix, 330e, 530e, 550e, 750e, i4, i5, i7]
    rules:
      - {if: 'sdrive', then: fail, why: 'sDrive (rear-wheel drive)'}
      - {if: '\b[35]30e\b(?!.*(xdrive|530 ?xe|\bawd\b|all.wheel))', then: fail, why: '330e / 530e without xDrive (rear-wheel drive)'}
      - {if: '\bedrive ?(35|40|50)\b', then: fail, why: 'i4 / i5 / i7 eDrive (rear-wheel drive)'}
      - {if: '\b7 series\b|\b7[46]0i\b', unless: '750e|\bi7\b', then: fail, why: '7 Series gas (only the 750e plug-in and electric i7 count)'}
      # M versions (X3 M40i/M50/X3 M, X5 M50i/M60i/X5 M, iX M60/M70) are fine (user, Oct 19 2026)
  Mercedes-Benz:
    allow: 'glc|gle|eqb|eqe|eqs|\b[ces][ -]?class\b|(?<![a-z])[ce] ?(53|63)\b|\bs ?580e\b'
    list: GLC 300/350e, GLE 350/450/450e, electric EQB / EQE SUV / EQS SUV; EQE / EQS sedan, plug-in AMG E 53 HYBRID / C 63 S E PERFORMANCE / S 580e
    tokens: [eqb, eqe, eqs, e-53, c-63, s-580e, s-class]
    rules:
      - {if: 'coupe|maybach', then: fail, why: 'Coupe / Maybach (not on the list)'}   # AMG and GLE 580 are fine (user likes performance cars, Oct 19 2026)
      - {if: 'eqb ?250', then: fail, why: 'EQB 250 (front-wheel drive)'}
      - {if: '(?<![a-z])e ?53(?!.*hybrid)(?!e)', to_year: 2024, then: fail, why: 'AMG E 53 before 2025 (mild hybrid = gas)'}
      - {if: 'eq[es]\s*(320|350|450)\s*(\+|plus)(?!\s*4matic)', then: fail, why: 'EQE / EQS "+" (rear-wheel drive)'}
      - {if: 'eqb|eqs.*suv', then: note, why: 'EQB / EQS SUV can have a third row: confirm it has 5 seats'}
  Volkswagen:
    allow: 'tiguan|\bid\.? ?-?4\b'
    list: Tiguan 2025+, ID.4 AWD (electric)
    tokens: [id.4, id-4]
    rules:
      - {if: tiguan, min_year: 2025, why: 'Tiguan before 2025 (AWD versions have a third row)'}
      - {if: 'id\.? ?-?4.*\bpro\b(?! ?s\b)', then: fail, why: 'ID.4 AWD Pro (not Pro S): no glass roof, cloth seats'}
  Lexus:
    allow: '\b(nx|rx|rz|es)\b'
    list: NX, RX, RZ (electric); ES 500e (electric sedan)
    tokens: [rz, 500e]
    rules:
      - {if: 'rx ?\d{3}h?\+? ?l\b|\brx ?l\b', then: fail, why: 'RX L (3-row)'}
      - {if: 'nx ?250|\b250\b', unless: '350|450', then: fail, why: 'NX 250 (only NX 350 / 350h / 450h+)'}
      - {if: '\brz ?(300e|350e)\b', then: fail, why: 'RZ 300e / 350e (front-wheel drive)'}
      - {if: '\bes ?350e\b', then: fail, why: 'ES 350e (front-wheel drive)'}
      - {if: '\bes ?(300h|250|350)\b(?!h)', then: fail, why: 'ES 300h / 250 / 350 (front-wheel drive or gas)'}
  Volvo:
    allow: 'xc60|\bs[69]0\b'     # no XC40 / EX40 / C40 / EC40 (user, Oct 19 2026: "The xc40 is too small")
    list: XC60; plug-in sedans S60 / S90 T8
    tokens: [s60, s90]
    rules: []
  Toyota:
    allow: '4runner|land cruiser|bz4x|\bbz\b'
    list: 4Runner, Land Cruiser 2024+, bZ4X / bZ (electric)
    tokens: [bz4x, bz]
    rules:
      - {if: 'land cruiser', min_year: 2024, why: 'Land Cruiser before 2024'}
      - {if: '\bbz\b.*woodland', unless: 'premium', then: fail, why: 'bZ Woodland without the Premium Package: no glass roof'}
  Ford:
    allow: 'bronco|mach[ -]?e'
    list: Bronco 4-door, Bronco Sport, Mustang Mach-E (electric)
    tokens: [mach-e]
    rules:                         # Bronco Sport added Oct 17 2026 (user asked); every Bronco Sport is a 2-row 4x4
      - {if: '2[- ]?door|2dr', unless: 'bronco[ -]?sport', then: fail, why: '2-door Bronco'}
      - {if: 'bronco', unless: '4[- ]?door|4dr|bronco[ -]?sport', then: call, why: "confirm it's a 4-door Bronco"}
      # Bronco Sport (Ford order guides 2023-26, Oct 2026): only Big Bend / Free Wheeling can have a sunroof AND all-black seats
      - {if: 'bronco[ -]?sport.*heritage', then: fail, why: 'Bronco Sport Heritage: no interior with black (Navy Pier, Norias)'}
      # Outer Banks / Badlands: Ebony/Roast two-tone includes black (OK since Oct 19 2026); Dark Space Gray seats fail on color
      - {if: 'bronco[ -]?sport[ -]base\b', then: fail, why: 'Bronco Sport Base: no sunroof offered'}
      - {if: 'bronco[ -]?sport', unless: 'big[ -]?bend|free[ -]?wheeling|outer[ -]?banks|badlands|heritage|sasquatch|[ -]base\b', then: call, why: 'confirm the Bronco Sport trim (Base has no sunroof; Heritage has no black interior)'}
      - {if: 'bronco[ -]?sport.*big[ -]?bend', then: note, why: 'Big Bend: sunroof only with the Convenience Package; 2025+ black seats only with the Black Appearance Package'}
      - {if: 'mach[ -]?e.*\b(select|rally)\b', then: fail, why: 'Mach-E Select / Rally: no glass roof offered'}
      - {if: 'mach[ -]?e.*(\bgt\b|performance edition)', from_year: 2024, then: fail, why: 'Mach-E GT 2024+: Performance Gray interior only'}
      - {if: 'mach[ -]?e.*performance edition', then: fail, why: 'Mach-E GT Performance Edition: Performance Gray interior only'}
      - {if: 'bronco[ -]?sport.*free[ -]?wheeling', then: note, why: 'Free Wheeling: Ebony cabin but multicolor Sunset Weave seat pattern - check photos'}

  Mazda:
    allow: '\bcx ?-?(5|50|70)\b'
    list: CX-5, CX-50 (incl. Hybrid 2025+), CX-70 2025+
    tokens: [cx-5, cx5, cx-50, cx50, cx-70, cx70]
    feed_models: [CX5, C50, 50H, C70, C7P]       # mazdausa.com carline codes: CX-5, CX-50, CX-50 Hybrid, CX-70, CX-70 PHEV
    rules:
      - {if: turbo signature, then: fail, why: 'CX-5 Turbo Signature: Caturra Brown Nappa interior only (no black)'}
      - {if: carbon turbo, then: fail, why: 'CX-5 Carbon Turbo: Terracotta interior only (paint Zircon Sand / Rhodium White)'}
      - {if: turbo.*meridian|meridian.*turbo, then: fail, why: 'CX-50 Turbo Meridian Edition: Terracotta leather only (no black)'}
      - {if: meridian, unless: turbo|\bs meridian, then: call, why: 'CX-50 Meridian Edition: 2023-25 (all Turbo) are Terracotta-only; the 2026 2.5 S Meridian is black - confirm which'}
      - {if: 'turbo s premium ?plus', then: fail, why: 'CX-70 Turbo S Premium Plus: quilted Tan Nappa only (no black)'}
      - {if: phev sc|\bsc plus\b, then: fail, why: '2026 CX-70 PHEV SC / SC Plus: no sunroof offered'}
      - {if: \bs select\b|select package, then: fail, why: 'CX-5 / CX-50 Select: no sunroof (any year)'}
      - {if: carbon edition, then: note, why: 'CX-5 Carbon Edition: Polymetal Gray; black (red-stitched) or red leather - check interior'}
      - {if: terracotta|caturra|parchment|greige|sport tan|tan nappa|tan leather|white leather|red leather, then: fail, why: non-black Mazda interior named in the listing}

  Kia:
    allow: 'sportage|\bev6\b'
    list: Sportage (gas SX-Prestige/X-Pro/X-Pro Prestige, Hybrid SX-Prestige/X-Line, Plug-in Hybrid), EV6 AWD (electric)
    tokens: [sportage, ev6]
    feed_models: [Sportage, Sportage Hybrid, Sportage Plug-in Hybrid, EV6]   # names in kia.com's certified search
    rules:
      - {min_year: 2023, why: Sportage before 2023 (older generation)}
      - {if: \blx\b, then: fail, why: 'Sportage LX: no sunroof offered (cloth seats)'}
      - {if: \bhybrid s\b|\bsportage s\b|\bs (awd|fwd)\b, then: fail, why: 'Sportage Hybrid S: no sunroof offered (cloth seats)'}
      - {if: 'plug ?in|phev', then: note, why: plug-in hybrid (plug-in price cap applies)}
      - {if: '\bev6\b.*\b(light|wind)\b', unless: '\bgt\b', then: fail, why: 'EV6 Light / Wind: no sunroof offered (GT-Line / GT only)'}

  Acura:                           # added Oct 19 2026 (user: reliability/warranty better than the German brands)
    allow: '\bzdx\b|\brdx\b'
    list: ZDX (electric, AWD), RDX (SH-AWD)
    tokens: [zdx, rdx]
    rules:
      - {if: '\bzdx\b', min_year: 2024, why: 'ZDX before 2024 (old gas model)'}

  Alfa Romeo:                      # added Oct 19 2026 (user asked; long CPO warranty, weaker reliability)
    allow: 'tonale|stelvio'
    list: Tonale (plug-in hybrid), Stelvio
    tokens: [tonale, stelvio]
    rules:
      - {if: tonale, min_year: 2024, why: 'Tonale before 2024 (not sold in the US)'}

# Trims where a sunroof is always standard, used only when the listing doesn't say
# (shown as "sunroof (standard on this trim)"). Edit if you know better.
sunroof_standard:
  # Q5: optional on the 2023-2025 Premium (old generation and first new-generation SUVs); standard from 2026
  - {make: Audi, model: Q5, trim_regex: "premium plus|prestige", note: "panoramic sunroof is standard on Q5 Premium Plus / Prestige"}
  - {make: Audi, model: Q5, trim_regex: "sportback", min_year: 2025, note: "panoramic sunroof is standard on the 2025+ Q5 Sportback"}
  - {make: Audi, model: Q5, trim_regex: ".*", min_year: 2026, note: "panoramic sunroof is standard on the 2026+ Q5"}
  - {make: Audi, model: Q3, trim_regex: ".*", note: "panoramic sunroof is standard on every Q3"}
  - {make: BMW, model: X5, trim_regex: ".*", note: "panoramic moonroof is standard on the X5"}
  - {make: Genesis, model: GV70, trim_regex: "select|advanced|prestige", note: "panoramic roof standard from Select up"}
  - {make: Volvo, model: XC60, trim_regex: "plus|ultimate|inscription|r-design", note: "panoramic roof standard on Plus/Ultimate"}
  - {make: Ford, model: Bronco, not_model: "bronco sport", trim_regex: ".*", note: "removable roof panels"}
  # Subaru (media.subaru.com spec sheets, Oct 2026): Forester = every trim but Base; Outback = Touring and XT
  # every year, Limited from 2025; Outback Wilderness and the 2023-24 Outback Limited have it only as an option
  - {make: Subaru, model: Forester, trim_regex: "premium|sport|limited|touring|wilderness|hybrid", note: "panoramic moonroof is standard on every Forester but the Base"}
  - {make: Subaru, model: Outback, trim_regex: "touring|\\bxt\\b", note: "moonroof is standard on Outback Touring / XT"}
  - {make: Subaru, model: Outback, trim_regex: "limited", min_year: 2025, note: "moonroof is standard on the 2025+ Outback Limited"}

  # Electric SUVs (researched Oct 18 2026 from makers' press sites, Car and Driver, fueleconomy.gov; fixed glass roofs count)
  - {make: "Audi", model: "Q4 e-tron", trim_regex: ".*", min_year: 2023, max_year: 2026, note: "panoramic sunroof (opens) is standard on every Q4 e-tron / Q4 Sportback e-tron"}
  - {make: "Audi", model: "Q8 e-tron", trim_regex: ".*", min_year: 2024, max_year: 2025, note: "opening panoramic glass roof is standard on the Q8 e-tron"}
  - {make: "Audi", model: "e-tron", not_model: "e-tron gt", trim_regex: ".*", min_year: 2023, max_year: 2023, note: "unconfirmed: panoramic sunroof believed standard on every 2023 e-tron (not checked in an Audi 2023 sheet); remove if a Premium shows up without it"}
  - {make: "Audi", model: "Q6 e-tron", trim_regex: "premium plus|prestige", min_year: 2025, max_year: 2025, note: "panoramic sunroof (opens) is standard on Q6 e-tron Premium Plus / Prestige (not Premium)"}
  - {make: "BMW", model: "iX", trim_regex: ".*", min_year: 2023, max_year: 2025, note: "fixed panoramic glass roof with electrochromic shading is standard on every 2023-25 iX (does not open; counts)"}
  - {make: "BMW", model: "iX", trim_regex: "xdrive ?60|\\b60\\b", min_year: 2026, max_year: 2026, note: "fixed Panoramic Eclipsing Roof is standard on the 2026 iX xDrive60 (optional on xDrive45)"}
  - {make: "Mercedes-Benz", model: "EQE SUV", trim_regex: ".*", min_year: 2023, max_year: 2026, note: "power tilt/sliding panorama roof is standard on every EQE SUV"}
  - {make: "Mercedes-Benz", model: "EQS SUV", trim_regex: ".*", min_year: 2023, max_year: 2026, note: "power tilt/sliding panorama roof is standard on every EQS SUV"}
  - {make: "Genesis", model: "GV60", trim_regex: ".*", min_year: 2023, max_year: 2026, note: "fixed panoramic glass \"Vision Roof\" with power shade is standard on every GV60 (does not open)"}
  - {make: "Volkswagen", model: "ID.4", trim_regex: "pro s", min_year: 2023, max_year: 2026, note: "panoramic fixed glass roof is standard on ID.4 Pro S / Pro S Plus (does not open)"}
  - {make: "Volvo", model: "XC40", trim_regex: "(?=.*(recharge|electric|twin|single motor|pure electric|\\bbev\\b))(?=.*(\\bplus\\b|ultimate|ultra))", min_year: 2023, max_year: 2024, note: "opening panoramic sunroof is standard on XC40 Recharge Plus / Ultimate (electric; trim text says Recharge / Twin / Electric). Gas XC40 Plus/Ultimate also have it"}
  - {make: "Volvo", model: "EX40", trim_regex: "\\bplus\\b|ultimate|ultra", min_year: 2025, max_year: 2026, note: "opening panoramic sunroof is standard on EX40 Plus / Ultra"}
  - {make: "Volvo", model: "C40", not_model: "xc40", trim_regex: ".*", min_year: 2023, max_year: 2024, note: "fixed panoramic glass roof is standard on every C40 Recharge (does not open)"}
  - {make: "Volvo", model: "EC40", trim_regex: ".*", min_year: 2025, max_year: 2026, note: "fixed panoramic glass roof on every EC40 (carried over from C40; unconfirmed for 2025-26)"}
  - {make: "Lexus", model: "RZ", trim_regex: ".*", min_year: 2023, max_year: 2024, note: "fixed panoramic glass roof is standard on every 2023-24 RZ (Premium / Luxury; does not open)"}
  - {make: "Lexus", model: "RZ", trim_regex: "premium|luxury|f ?sport|550e", min_year: 2025, max_year: 2026, note: "fixed panoramic glass roof is standard on RZ Premium / Luxury / 550e F SPORT, not on the 2025+ entry grade"}
  - {make: "Toyota", model: "bZ4X", trim_regex: ".*", min_year: 2023, max_year: 2025, note: "panoramic fixed-glass roof (doesn't open) is standard on every 2023-2025 bZ4X"}
  - {make: "Toyota", model: "bZ", trim_regex: "limited", min_year: 2026, note: "panoramic fixed-glass roof (doesn't open) is standard on the 2026+ bZ Limited (optional on XLE)"}
  - {make: "Toyota", model: "bZ", trim_regex: "woodland.*premium|premium.*woodland", min_year: 2026, note: "panoramic fixed-glass roof is part of the bZ Woodland Premium"}
  - {make: "Subaru", model: "Solterra", trim_regex: "touring", min_year: 2023, note: "panoramic glass moonroof (fixed glass) is standard on Solterra Touring / Touring Onyx / Touring XT only"}
  - {make: "Ford", model: "Mustang Mach-E", trim_regex: "premium|california route 1|route 1|\\bgt\\b", min_year: 2023, max_year: 2023, note: "panoramic fixed-glass roof is standard on the 2023 Mach-E Premium, California Route 1 and GT (optional from 2024; never on Select)"}
  - {make: "Kia", model: "EV6", trim_regex: "gt line|\\bgt\\b", min_year: 2023, note: "power tilt/slide sunroof is standard on EV6 GT-Line and GT (not on Light or Wind); 2026 GT-Line assumed"}

  # Plug-in / electric sedans (researched Oct 19 2026)
