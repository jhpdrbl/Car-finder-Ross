# Search criteria for the CPO SUV finder (spec Sections 3-5, 7, 11).

home:
  zip: "90039"
  lat: 34.1105   # 90039 (Atwater Village / Silver Lake) centroid
  lon: -118.2600
  radius_miles: 50          # dealers 50-60 mi still count, flagged "edge"
  edge_radius_miles: 60      # farthest dealer included

scrape:
  user_agent: "CarFinderRoss/0.1 (personal CPO SUV search; contact jhpd.rbl@gmail.com)"
  min_delay_seconds: 2.0
  max_delay_seconds: 3.0
  cache_hours: 6
  timeout_seconds: 30
  max_vdps_per_dealer: 400

filters:
  min_year: 2023
  max_mileage: 39999          # "under 40,000"
  drivetrains: [AWD, 4WD]
  max_rows: 2
  price_caps:                 # total incl. dealer fees, before tax
    gas: 35000
    hybrid: 40000
    phev: 40000
    ev: null                  # EV only if exceptional_ev_deal
  price_tolerance: 500        # cushion over every cap (gas $35,500, hybrid/PHEV $40,500)
  exceptional_ev_discount: 0.15
  ev_min_comparables: 3
  estimated_fees:             # used when the page shows no fee breakdown
    doc_fee: 85               # California dealer doc-fee cap
    other_fees: 100           # electronic filing etc.
  sunroof_required: true
  exterior_colors:
    include: [black, gray, grey, graphite, charcoal, gunmetal, thunder, makalu,
              mythos, vik, onyx, daytona, carbon, obsidian, magnetic, crystal black,
              "dark green", "autumn green", "british racing", "racing green",
              "cypress green", "eruption green", "area 51", "shadow", "slate",
              "manhattan", "ebony", "jet", "nebula", "smoke", "tungsten", "anthracite",
              "storm", "asphalt", "steel", "cement", "lunar", "magnetite", "iridium",
              "selenite", "titanium", "ash"]   # list reviewed per-run in fail_reasons
    exclude: [silver, white, pearl white, beige, blue, red, matte, frozen, glacier, ivory,
              cream, champagne, bronze, orange, yellow, brown, copper, gold, tan]
    green_must_be_dark: true  # light greens (e.g. "Sage", "Lime") excluded
  interior_colors:
    include: [black, obsidian, charcoal, "slate black", ebony, jet, onyx, "black/black"]
    exclude: [beige, brown, white, red, tan, cognac, saddle, ivory, cream, caramel,
              chestnut, macchiato, sand, "palomino", "rioja", "glazed caramel", blond, blonde,
              oyster, parchment, linen, "light gray", amber, cognac, mocha, espresso, sienna, "flaxen"]
  carfax_exclude_accident: true

scoring:            # higher = better; weights sum is arbitrary, score scaled 0-100
  price_target: 30000
  weights:
    price: 30       # high
    phev: 25        # high
    mpg: 12         # medium
    audio: 12       # medium
    leather: 5      # low
    ventilated_seats: 5
    ground_clearance: 5
    spare_tire: 6
  premium_audio: ["bang & olufsen", "b&o", "lexicon", "harman/kardon", "harman kardon",
                  "burmester", "bowers & wilkins", "bowers and wilkins", "mark levinson"]
  fake_leather: [leatherette, "mb-tex", "mb tex", sensatec, startex, softex, "synthetic leather",
                 "vegan leather", "nuluxe", "leather-trimmed seats with synthetic"]

finance:
  down_payment: 8000
  term_months: 60
  apr: 0.0534
  sales_tax: 0.0975
  gov_fees: 400

# Warranty end dates on the dashboard assume this much driving per year after you buy.
warranty:
  miles_per_year: 12000

buying_context:
  - "$8,000 down; Bank of America pre-approval at 5.34% APR (30-day validity)"
  - "Earliest pickup: November 14"
  - "Insurance: AAA (bundled with renters)"
  - "Gas-only cars capped at $35,000"

# Which models count, per dealer brand. Each brand has:
#   allow: regex that the model name must match
#   rules: checked against "model + trim + title + listing URL" (lower case);
#          when `if` matches (and `unless` doesn't), the car is excluded (fail),
#          sent to Needs a call (call), or just flagged (note). `min_year` adds a year rule.
# CPO program names are in verify/certification.py.
models:
  Audi:
    allow: '\bq[35]\b'
    list: Q3, Q5
    rules:
      - {if: '\bsq[35]\b|\brs ?q', then: fail, why: 'SQ3/SQ5/RS model (performance versions not on the list)'}
      - {if: 'sportback', then: note, why: 'Sportback'}
  Genesis:
    allow: 'gv70|gv80'
    list: GV70, GV80
    rules:
      - {if: 'gv80.*coupe', then: note, why: 'GV80 Coupe'}
  Subaru:
    allow: 'forester|outback'
    list: Forester, Outback
    rules:
      - {if: 'forester', unless: 'limited|touring|wilderness|hybrid|strong hev', then: fail,
         why: 'Forester trim (Limited/Touring/Wilderness or Hybrid only)'}
      - {if: 'outback', unless: 'limited|touring|wilderness', then: fail, why: 'Outback trim (Limited/Touring/Wilderness only)'}
  BMW:
    allow: '\bx[35]\b'
    list: X3, X5
    rules:
      - {if: 'sdrive', then: fail, why: 'sDrive (rear-wheel drive)'}
      - {if: '\bm40|\bm50|\bm60|x[35] m\b|competition', then: fail, why: 'M version (only X3 xDrive30i, X5 xDrive40i/50e)'}
  Mercedes-Benz:
    allow: 'glc|gle'
    list: GLC 300/350e, GLE 350/450/450e
    rules:
      - {if: 'amg|gl[ce] ?43|gl[ce] ?53|gl[ce] ?63|coupe|gle ?580', then: fail, why: 'AMG / Coupe / GLE 580 (not on the list)'}
  Volkswagen:
    allow: 'tiguan'
    list: Tiguan 2025+
    rules:
      - {min_year: 2025, why: 'Tiguan before 2025 (AWD versions have a third row)'}
  Lexus:
    allow: '\b(nx|rx)\b'
    list: NX, RX
    rules:
      - {if: 'rx ?\d{3}h?\+? ?l\b|\brx ?l\b', then: fail, why: 'RX L (3-row)'}
      - {if: 'nx ?250|\b250\b', unless: '350|450', then: fail, why: 'NX 250 (only NX 350 / 350h / 450h+)'}
  Volvo:
    allow: 'xc60|xc40|ex40'
    list: XC60, XC40
  Toyota:
    allow: '4runner|land cruiser'
    list: 4Runner, Land Cruiser 2024+
    rules:
      - {if: 'land cruiser', min_year: 2024, why: 'Land Cruiser before 2024'}
  Ford:
    allow: 'bronco'
    list: Bronco 4-door
    rules:
      - {if: 'bronco sport|bronco-sport', then: fail, why: 'Bronco Sport (not on the list)'}
      - {if: '2[- ]?door|2dr', then: fail, why: '2-door Bronco'}
      - {if: 'bronco', unless: '4[- ]?door|4dr', then: call, why: "confirm it's a 4-door Bronco"}

# Trims where a sunroof is always standard, used only when the listing doesn't say
# (shown as "sunroof (standard on this trim)"). Edit if you know better.
sunroof_standard:
  # Q5: optional on the 2023-2025 Premium (old generation and first new-generation SUVs); standard from 2026
  - {make: Audi, model: Q5, trim_regex: "premium plus|prestige", note: "panoramic sunroof is standard on Q5 Premium Plus / Prestige"}
  - {make: Audi, model: Q5, trim_regex: "sportback", min_year: 2025, note: "panoramic sunroof is standard on the 2025+ Q5 Sportback"}
  - {make: Audi, model: Q5, trim_regex: ".*", min_year: 2026, note: "panoramic sunroof is standard on the 2026+ Q5"}
  - {make: Audi, model: Q3, trim_regex: ".*", note: "panoramic sunroof is standard on every Q3"}
  - {make: BMW, model: X5, trim_regex: ".*", note: "panoramic moonroof is standard on the X5"}
  - {make: Genesis, model: GV70, trim_regex: "select|advanced|prestige", note: "panoramic roof standard from Select up"}
  - {make: Volvo, model: XC60, trim_regex: "plus|ultimate|inscription|r-design", note: "panoramic roof standard on Plus/Ultimate"}
  - {make: Ford, model: Bronco, trim_regex: ".*", note: "removable roof panels"}
  # Subaru (media.subaru.com spec sheets, Oct 2026): Forester = every trim but Base; Outback = Touring and XT
  # every year, Limited from 2025; Outback Wilderness and the 2023-24 Outback Limited have it only as an option
  - {make: Subaru, model: Forester, trim_regex: "premium|sport|limited|touring|wilderness|hybrid", note: "panoramic moonroof is standard on every Forester but the Base"}
  - {make: Subaru, model: Outback, trim_regex: "touring|\\bxt\\b", note: "moonroof is standard on Outback Touring / XT"}
  - {make: Subaru, model: Outback, trim_regex: "limited", min_year: 2025, note: "moonroof is standard on the 2025+ Outback Limited"}

