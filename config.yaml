# Search criteria for the CPO SUV finder (spec Sections 3-5, 7, 11).

home:
  zip: "90039"
  lat: 34.1105   # 90039 (Atwater Village / Silver Lake) centroid
  lon: -118.2600
  radius_miles: 50          # dealers 50-60 mi still count, flagged "edge"
  edge_radius_miles: 60      # farthest dealer included

scrape:
  user_agent: "CarFinderRoss/0.1 (personal CPO SUV search; contact jhpd.rbl@gmail.com)"
  min_delay_seconds: 2.0
  max_delay_seconds: 3.0
  cache_hours: 6
  timeout_seconds: 30
  max_vdps_per_dealer: 400

filters:
  min_year: 2023
  max_mileage: 39999          # "under 40,000"
  drivetrains: [AWD, 4WD]
  max_rows: 2
  price_caps:                 # total incl. dealer fees, before tax
    gas: 35000
    hybrid: 40000
    phev: 40000
    ev: 40000                 # electric added Oct 18 2026 (user: "Add electric"); same cap as hybrid/plug-in. null = only exceptional EV deals
  price_tolerance: 500        # cushion over every cap (gas $35,500, hybrid/PHEV $40,500)
  exceptional_ev_discount: 0.15
  ev_min_comparables: 3
  estimated_fees:             # used when the page shows no fee breakdown
    doc_fee: 85               # California dealer doc-fee cap
    other_fees: 100           # electronic filing etc.
  sunroof_required: true
  exterior_colors:
    include: [black, gray, grey, graphite, charcoal, gunmetal, thunder, makalu,
              mythos, vik, onyx, daytona, carbon, obsidian, magnetic, crystal black,
              "dark green", "autumn green", "british racing", "racing green",
              "cypress green", "eruption green", "area 51", "shadow", "slate",
              "manhattan", "ebony", "jet", "nebula", "smoke", "tungsten", "anthracite",
              "storm", "asphalt", "steel", "cement", "lunar", "magnetite", "iridium",
              "selenite", "titanium", "ash"]   # list reviewed per-run in fail_reasons
    exclude: [silver, white, pearl white, beige, blue, red, matte, frozen, glacier, ivory,
              cream, champagne, bronze, orange, yellow, brown, copper, gold, tan]
    green_must_be_dark: true  # light greens (e.g. "Sage", "Lime") excluded
  interior_colors:
    include: [black, obsidian, charcoal, "slate black", ebony, jet, onyx, "black/black"]
    exclude: [beige, brown, white, red, tan, cognac, saddle, ivory, cream, caramel,
              chestnut, macchiato, sand, "palomino", "rioja", "glazed caramel", blond, blonde,
              oyster, parchment, linen, "light gray", amber, cognac, mocha, espresso, sienna, "flaxen",
              greige, griege, terracotta, caturra, roast, "navy pier", norias, truffle, "bronze fire", hazel, "misty gray"]
  carfax_exclude_accident: true

scoring:            # higher = better; weights sum is arbitrary, score scaled 0-100
  price_target: 30000
  weights:
    price: 30       # high
    phev: 25        # high (electric cars get it too: they plug in)
    mpg: 12         # medium
    audio: 12       # medium
    leather: 5      # low
    ventilated_seats: 5
    ground_clearance: 5
    spare_tire: 6
  premium_audio: ["bang & olufsen", "b&o", "lexicon", "harman/kardon", "harman kardon",
                  "burmester", "bowers & wilkins", "bowers and wilkins", "mark levinson"]
  fake_leather: [leatherette, "mb-tex", "mb tex", sensatec, startex, softex, "synthetic leather",
                 "vegan leather", "nuluxe", "leather-trimmed seats with synthetic"]

finance:
  down_payment: 8000
  term_months: 60
  apr: 0.0534
  sales_tax: 0.0975
  gov_fees: 400

# Warranty end dates on the dashboard assume this much driving per year after you buy.
warranty:
  miles_per_year: 12000

buying_context:
  - "$8,000 down; Bank of America pre-approval at 5.34% APR (30-day validity)"
  - "Earliest pickup: November 14"
  - "Insurance: AAA (bundled with renters)"
  - "Gas-only cars capped at $35,000"

# Which models count, per dealer brand. Each brand has:
#   allow: regex that the model name must match
#   rules: checked against "model + trim + title + listing URL" (lower case);
#          when `if` matches (and `unless` doesn't), the car is excluded (fail),
#          sent to Needs a call (call), or just flagged (note). `min_year` adds a year rule.
# CPO program names are in verify/certification.py.
models:
  Audi:
    allow: '\bq[35]\b|\bq[468] ?(sportback )?e-?tron|\be-?tron\b'
    list: Q3, Q5, electric Q4 / Q6 / Q8 e-tron
    tokens: [q4, q6, q8, e-tron]
    rules:
      - {if: '\bsq[3568]\b|\brs ?q|\brs ?e-?tron', then: fail, why: 'SQ / RS model (performance versions not on the list)'}
      - {if: 'e-?tron gt', then: fail, why: 'e-tron GT (a sedan)'}
      - {if: 'sportback', then: note, why: 'Sportback'}
  Genesis:
    allow: 'gv60|gv70|gv80'
    list: GV60 (electric), GV70 (incl. Electrified), GV80
    tokens: [gv60]
    rules:
      - {if: 'gv80.*coupe', then: note, why: 'GV80 Coupe'}
  Subaru:
    allow: 'forester|outback|solterra'
    list: Forester, Outback, Solterra (electric)
    tokens: [solterra]
    rules:
      - {if: 'forester', unless: 'limited|touring|wilderness|hybrid|strong hev', then: fail,
         why: 'Forester trim (Limited/Touring/Wilderness or Hybrid only)'}
      - {if: 'outback', unless: 'limited|touring|wilderness', then: fail, why: 'Outback trim (Limited/Touring/Wilderness only)'}
  BMW:
    allow: '\bx[35]\b|\bix\b'
    list: X3, X5, iX (electric)
    tokens: [ix]
    rules:
      - {if: 'sdrive', then: fail, why: 'sDrive (rear-wheel drive)'}
      - {if: '\bm40|\bm50|\bm60|x[35] m\b|competition', then: fail, why: 'M version (only X3 xDrive30i, X5 xDrive40i/50e)'}
  Mercedes-Benz:
    allow: 'glc|gle|eqb|eqe|eqs'
    list: GLC 300/350e, GLE 350/450/450e, electric EQB / EQE SUV / EQS SUV
    tokens: [eqb, eqe, eqs]
    rules:
      - {if: 'amg|gl[ce] ?43|gl[ce] ?53|gl[ce] ?63|coupe|gle ?580', then: fail, why: 'AMG / Coupe / GLE 580 (not on the list)'}
  Volkswagen:
    allow: 'tiguan|\bid\.? ?-?4\b'
    list: Tiguan 2025+, ID.4 AWD (electric)
    tokens: [id.4, id-4]
    rules:
      - {if: tiguan, min_year: 2025, why: 'Tiguan before 2025 (AWD versions have a third row)'}
  Lexus:
    allow: '\b(nx|rx|rz)\b'
    list: NX, RX, RZ (electric)
    tokens: [rz]
    rules:
      - {if: 'rx ?\d{3}h?\+? ?l\b|\brx ?l\b', then: fail, why: 'RX L (3-row)'}
      - {if: 'nx ?250|\b250\b', unless: '350|450', then: fail, why: 'NX 250 (only NX 350 / 350h / 450h+)'}
  Volvo:
    allow: 'xc60|xc40|ex40|\be?c40\b'
    list: XC60, XC40 (incl. Recharge / EX40), C40 Recharge / EC40
    tokens: [c40, ec40]
  Toyota:
    allow: '4runner|land cruiser|bz4x|\bbz\b'
    list: 4Runner, Land Cruiser 2024+, bZ4X / bZ (electric)
    tokens: [bz4x, bz]
    rules:
      - {if: 'land cruiser', min_year: 2024, why: 'Land Cruiser before 2024'}
  Ford:
    allow: 'bronco|mach[ -]?e'
    list: Bronco 4-door, Bronco Sport, Mustang Mach-E (electric)
    tokens: [mach-e]
    rules:                         # Bronco Sport added Oct 17 2026 (user asked); every Bronco Sport is a 2-row 4x4
      - {if: '2[- ]?door|2dr', unless: 'bronco[ -]?sport', then: fail, why: '2-door Bronco'}
      - {if: 'bronco', unless: '4[- ]?door|4dr|bronco[ -]?sport', then: call, why: "confirm it's a 4-door Bronco"}
      # Bronco Sport (Ford order guides 2023-26, Oct 2026): only Big Bend / Free Wheeling can have a sunroof AND all-black seats
      - {if: 'bronco[ -]?sport.*(outer[ -]?banks|badlands|heritage|sasquatch)', then: fail, why: 'Bronco Sport Outer Banks / Badlands / Heritage: no all-black interior with a sunroof (Roast, Navy Pier, Norias, Dark Space Gray)'}
      - {if: 'bronco[ -]?sport[ -]base\b', then: fail, why: 'Bronco Sport Base: no sunroof offered'}
      - {if: 'bronco[ -]?sport', unless: 'big[ -]?bend|free[ -]?wheeling|outer[ -]?banks|badlands|heritage|sasquatch|[ -]base\b', then: call, why: 'confirm the Bronco Sport trim (only Big Bend / Free Wheeling can have a sunroof with black seats)'}
      - {if: 'bronco[ -]?sport.*big[ -]?bend', then: note, why: 'Big Bend: sunroof only with the Convenience Package; 2025+ black seats only with the Black Appearance Package'}
      - {if: 'bronco[ -]?sport.*free[ -]?wheeling', then: note, why: 'Free Wheeling: Ebony cabin but multicolor Sunset Weave seat pattern - check photos'}

  Mazda:
    allow: '\bcx ?-?(5|50|70)\b'
    list: CX-5, CX-50 (incl. Hybrid 2025+), CX-70 2025+
    tokens: [cx-5, cx5, cx-50, cx50, cx-70, cx70]
    feed_models: [CX5, C50, 50H, C70, C7P]       # mazdausa.com carline codes: CX-5, CX-50, CX-50 Hybrid, CX-70, CX-70 PHEV
    rules:
      - {if: turbo signature, then: fail, why: 'CX-5 Turbo Signature: Caturra Brown Nappa interior only (no black)'}
      - {if: carbon turbo, then: fail, why: 'CX-5 Carbon Turbo: Terracotta interior only (paint Zircon Sand / Rhodium White)'}
      - {if: turbo.*meridian|meridian.*turbo, then: fail, why: 'CX-50 Turbo Meridian Edition: Terracotta leather only (no black)'}
      - {if: meridian, unless: turbo|\bs meridian, then: call, why: 'CX-50 Meridian Edition: 2023-25 (all Turbo) are Terracotta-only; the 2026 2.5 S Meridian is black - confirm which'}
      - {if: 'turbo s premium ?plus', then: fail, why: 'CX-70 Turbo S Premium Plus: quilted Tan Nappa only (no black)'}
      - {if: phev sc|\bsc plus\b, then: fail, why: '2026 CX-70 PHEV SC / SC Plus: no sunroof offered'}
      - {if: \bs select\b|select package, then: fail, why: 'CX-5 / CX-50 Select: no sunroof (any year)'}
      - {if: carbon edition, then: note, why: 'CX-5 Carbon Edition: Polymetal Gray; black (red-stitched) or red leather - check interior'}
      - {if: terracotta|caturra|parchment|greige|sport tan|tan nappa|tan leather|white leather|red leather, then: fail, why: non-black Mazda interior named in the listing}

  Kia:
    allow: 'sportage|\bev6\b'
    list: Sportage (gas SX-Prestige/X-Pro/X-Pro Prestige, Hybrid SX-Prestige/X-Line, Plug-in Hybrid), EV6 AWD (electric)
    tokens: [sportage, ev6]
    feed_models: [Sportage, Sportage Hybrid, Sportage Plug-in Hybrid, EV6]   # names in kia.com's certified search
    rules:
      - {min_year: 2023, why: Sportage before 2023 (older generation)}
      - {if: \blx\b, then: fail, why: 'Sportage LX: no sunroof offered (cloth seats)'}
      - {if: \bhybrid s\b|\bsportage s\b|\bs (awd|fwd)\b, then: fail, why: 'Sportage Hybrid S: no sunroof offered (cloth seats)'}
      - {if: 'plug ?in|phev', then: note, why: plug-in hybrid (plug-in price cap applies)}

# Trims where a sunroof is always standard, used only when the listing doesn't say
# (shown as "sunroof (standard on this trim)"). Edit if you know better.
sunroof_standard:
  # Q5: optional on the 2023-2025 Premium (old generation and first new-generation SUVs); standard from 2026
  - {make: Audi, model: Q5, trim_regex: "premium plus|prestige", note: "panoramic sunroof is standard on Q5 Premium Plus / Prestige"}
  - {make: Audi, model: Q5, trim_regex: "sportback", min_year: 2025, note: "panoramic sunroof is standard on the 2025+ Q5 Sportback"}
  - {make: Audi, model: Q5, trim_regex: ".*", min_year: 2026, note: "panoramic sunroof is standard on the 2026+ Q5"}
  - {make: Audi, model: Q3, trim_regex: ".*", note: "panoramic sunroof is standard on every Q3"}
  - {make: BMW, model: X5, trim_regex: ".*", note: "panoramic moonroof is standard on the X5"}
  - {make: Genesis, model: GV70, trim_regex: "select|advanced|prestige", note: "panoramic roof standard from Select up"}
  - {make: Volvo, model: XC60, trim_regex: "plus|ultimate|inscription|r-design", note: "panoramic roof standard on Plus/Ultimate"}
  - {make: Ford, model: Bronco, not_model: "bronco sport", trim_regex: ".*", note: "removable roof panels"}
  # Subaru (media.subaru.com spec sheets, Oct 2026): Forester = every trim but Base; Outback = Touring and XT
  # every year, Limited from 2025; Outback Wilderness and the 2023-24 Outback Limited have it only as an option
  - {make: Subaru, model: Forester, trim_regex: "premium|sport|limited|touring|wilderness|hybrid", note: "panoramic moonroof is standard on every Forester but the Base"}
  - {make: Subaru, model: Outback, trim_regex: "touring|\\bxt\\b", note: "moonroof is standard on Outback Touring / XT"}
  - {make: Subaru, model: Outback, trim_regex: "limited", min_year: 2025, note: "moonroof is standard on the 2025+ Outback Limited"}

  # Mazda (news.mazdausa.com spec decks, Oct 2026)
  - {make: Mazda, model: CX-5, trim_regex: preferred|carbon|premium|turbo|signature, min_year: 2023, max_year: 2025, note: 'power moonroof is standard on CX-5 Preferred, Carbon Edition, Premium, Premium Plus and every Turbo (not on 2.5 S / Select)'}
  - {make: Mazda, model: CX-5, trim_regex: premium, min_year: 2026, max_year: 2026, note: panoramic sunroof is standard on the 2026 CX-5 Premium / Premium Plus only (not on Preferred)}
  - {make: Mazda, model: CX-50, trim_regex: preferred plus|premium|turbo|meridian, min_year: 2023, max_year: 2023, note: panoramic moonroof is standard on the 2023 CX-50 from Preferred Plus up and on every Turbo}
  - {make: Mazda, model: CX-50, trim_regex: premium|turbo|meridian, min_year: 2024, max_year: 2025, note: panoramic moonroof is standard on the 2024-25 CX-50 (and Hybrid) Premium / Premium Plus and every Turbo (not on Select / Preferred)}
  - {make: Mazda, model: CX-50, trim_regex: preferred|meridian|premium|turbo, min_year: 2026, max_year: 2026, note: panoramic moonroof is standard on every 2026 CX-50 but the Select (gas and Hybrid)}
  - {make: Mazda, model: CX-70, trim_regex: preferred|premium, min_year: 2025, max_year: 2026, note: sunroof is standard on every CX-70 Turbo and the 2025 PHEV (panoramic from Premium Plus up); not on the 2026 PHEV SC / SC Plus}

  # Kia Sportage (Kia pricing/feature tables, Oct 2026)
  - {make: Kia, model: Sportage, trim_regex: 'plug ?in|phev', min_year: 2023, note: 'panoramic sunroof is standard on both Sportage Plug-in Hybrid trims (X-Line, X-Line Prestige)'}
  - {make: Kia, model: Sportage, trim_regex: 'x ?pro ?prestige', min_year: 2023, max_year: 2026, note: panoramic sunroof is standard on the Sportage X-Pro Prestige}
  - {make: Kia, model: Sportage, trim_regex: 'x ?pro', min_year: 2023, max_year: 2025, note: panoramic sunroof is standard on the 2023-25 Sportage X-Pro (2027 X-Pro unconfirmed)}
  - {make: Kia, model: Sportage, trim_regex: 'sx ?prestige', min_year: 2023, note: panoramic sunroof is standard on the Sportage SX-Prestige (gas and hybrid)}
  - {make: Kia, model: Sportage, trim_regex: 'hybrid.*x ?line|x ?line.*hybrid', min_year: 2026, note: panoramic sunroof is standard on the 2026+ Sportage Hybrid X-Line}
  - {make: Kia, model: Sportage, trim_regex: 'x ?line', min_year: 2027, note: panoramic sunroof is standard on the 2027+ gas Sportage X-Line (optional package 2023-26)}
  - {make: Kia, model: Sportage, trim_regex: \bsx\b, min_year: 2023, note: panoramic sunroof is standard on the gas Sportage SX (AWD version offered only in 2023)}

